name: Publish current illustrated book edition

on:
  push:
    branches: [main]
    paths:
      - 'current-edition.json'
      - 'editions/**'
      - 'scripts/validate_edition.py'
      - '.github/workflows/publish-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-book-edition
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check if approved originals are staged
        id: files
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          edition = json.loads(Path('current-edition.json').read_text())
          paths = [Path(item['path']) for item in edition['files'].values()]
          ready = all(path.is_file() for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=' + str(ready).lower() + '\n')
          if not ready:
              print('Original edition PDFs not yet committed: ' +
                    ', '.join(str(path) for path in paths if not path.is_file()))
              print('No older draft will be published as a substitute.')
          PY
      - name: Install PDF validator
        if: steps.files.outputs.ready == 'true'
        run: python -m pip install 'pymupdf==1.26.5'
      - name: Validate illustration count, duplex orientation and content parity
        if: steps.files.outputs.ready == 'true'
        run: python scripts/validate_edition.py current-edition.json
      - name: Stage identical bytes under stable download names
        if: steps.files.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          edition = json.loads(Path('current-edition.json').read_text())
          out = Path('dist')
          out.mkdir(exist_ok=True)
          shutil.copyfile(edition['files']['reading']['path'], out / 'Sorting-Algorithms-with-Playing-Cards.pdf')
          shutil.copyfile(edition['files']['booklet']['path'], out / 'Sorting-Algorithms-with-Playing-Cards-Booklet-LONG-EDGE.pdf')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.files.outputs.ready == 'true'
        with:
          name: verified-current-book-edition
          path: dist/*.pdf
      - name: Publish both validated files as the latest edition
        if: steps.files.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c "import json; print(json.load(open('current-edition.json'))['version'])")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid edition: $VERSION" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          cat > /tmp/edition-notes.txt <<EOF
          Sorting Algorithms with Playing Cards, learner edition ${VERSION}.

          These are the original approved illustrated PDFs, not a rebuild of draft 0.3.
          Print the booklet landscape, double-sided, flip on LONG edge, at actual size.
          Edition 0.5 occupies 18 sheets. File checksums are in current-edition.json.
          EOF
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Sorting Algorithms with Playing Cards - Edition $VERSION" \
              --notes-file /tmp/edition-notes.txt
          fi
          gh release upload "$TAG" \
            dist/Sorting-Algorithms-with-Playing-Cards.pdf \
            dist/Sorting-Algorithms-with-Playing-Cards-Booklet-LONG-EDGE.pdf \
            --clobber
          gh release edit "$TAG" --draft=false --prerelease=false --latest \
            --title "Sorting Algorithms with Playing Cards - Edition $VERSION" \
            --notes-file /tmp/edition-notes.txt
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$ASSETS" | grep -Fxq 'Sorting-Algorithms-with-Playing-Cards.pdf'
          echo "$ASSETS" | grep -Fxq 'Sorting-Algorithms-with-Playing-Cards-Booklet-LONG-EDGE.pdf'
          echo "Published verified edition $VERSION."
