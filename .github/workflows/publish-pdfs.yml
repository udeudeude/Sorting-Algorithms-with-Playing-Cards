name: Build downloadable course and booklet PDFs

on:
  push:
    branches: [main]
    paths:
      - 'drafts/0.3/**'
      - 'scripts/impose_booklet.py'
      - 'tests/test_booklet.py'
      - '.github/workflows/publish-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-sorting-pdfs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pandoc and LaTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - name: Install XeLaTeX and DejaVu fonts
        run: sudo apt-get update && sudo apt-get install -y texlive-xetex texlive-latex-extra fonts-dejavu-core
      - name: Verify PDF engine
        run: xelatex --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install booklet imposition library
        run: python -m pip install 'pymupdf==1.26.5'
      - name: Test booklet imposition
        run: python tests/test_booklet.py
      - name: Prepare current 0.3 manuscript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          manuscript = Path('drafts/0.3/book.md').read_text(encoding='utf-8')
          art = Path('drafts/0.3/art-sheet.png')
          if not art.exists():
              missing = r'\includegraphics[width=0.95\textwidth,height=5.6in,keepaspectratio]{art-sheet.png}'
              assert missing in manuscript, 'Expected 0.3 cover image reference is missing'
              manuscript = manuscript.replace(missing, r'\vspace*{1.5in}')
              print('Cover artwork not committed; keep existing typography and omit missing image')
          Path('_build').mkdir(exist_ok=True)
          Path('_build/manuscript.md').write_text(manuscript, encoding='utf-8')
          PY
      - name: Render standard reading PDF from 0.3 manuscript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          quarto pandoc _build/manuscript.md --from markdown+raw_tex \
            --pdf-engine=xelatex --resource-path=drafts/0.3 \
            --output downloads/sorting-algorithms-with-playing-cards.pdf
      - name: Render compact booklet and impose duplex sheets
        shell: bash
        run: |
          set -euo pipefail
          quarto pandoc _build/manuscript.md --from markdown+raw_tex \
            --pdf-engine=xelatex --resource-path=drafts/0.3 \
            --metadata papersize:a5 --metadata geometry:margin=0.5in \
            --output downloads/sorting-algorithms-booklet-pages.pdf
          python scripts/impose_booklet.py \
            downloads/sorting-algorithms-booklet-pages.pdf \
            downloads/sorting-algorithms-booklet-print.pdf \
            --signature-sheets 8
      - name: Verify PDF content and duplex geometry
        shell: bash
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          root = Path('downloads')
          expected = {
              'sorting-algorithms-with-playing-cards.pdf',
              'sorting-algorithms-booklet-pages.pdf',
              'sorting-algorithms-booklet-print.pdf',
          }
          assert {p.name for p in root.glob('*.pdf')} == expected
          for filename in sorted(expected):
              doc = fitz.open(root / filename)
              assert doc.page_count > 4, (filename, doc.page_count)
              text = ''.join(page.get_text() for page in doc)
              assert 'Sorting Algorithms' in text, filename
              assert 'Cycle Sort' in text or 'Cycle' in text, filename
              if filename.endswith('booklet-print.pdf'):
                  assert doc.page_count % 2 == 0
                  assert all(abs(page.rect.width - 792) < 1 and abs(page.rect.height - 612) < 1 for page in doc)
              print(filename, doc.page_count, 'pages')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sorting-algorithms-draft-03-pdfs
          path: downloads/*.pdf
      - name: Publish stable direct-download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view learner-draft-0.3 > /dev/null 2>&1; then
            gh release create learner-draft-0.3 \
              --target main \
              --title "Sorting Algorithms with Playing Cards - Learner Draft 0.3" \
              --notes "Field-test manuscript 0.3. Includes a standard reading PDF, compact reading pages and duplex-imposed US-letter booklet PDF. Print the imposed booklet landscape, double-sided, short-edge flip, actual size. Fold each eight-sheet signature separately." \
              --prerelease
          fi
          gh release upload learner-draft-0.3 downloads/*.pdf --clobber
