name: Build and verify editable book editions

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Edition number, e.g. 0.9'
        required: true
        default: '0.9'
  pull_request:
    paths:
      - 'drafts/**'
      - 'scripts/build_edition.py'
      - '.github/workflows/build-edition.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install typesetting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-dejavu-core
          python -m pip install 'pymupdf==1.26.5'
      - name: Select edition
        id: edition
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          echo "version=${REQUESTED_VERSION:-0.9}" >> "$GITHUB_OUTPUT"
      - name: Verify originals and build both PDF formats
        run: python scripts/build_edition.py --version "${{ steps.edition.outputs.version }}" --text-only --output build
      - name: Validate PDF pages and illustrations
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          for name in ('Sorting-Algorithms-with-Playing-Cards.pdf', 'Sorting-Algorithms-with-Playing-Cards-Booklet-LONG-EDGE.pdf'):
              path = Path('build') / name
              with fitz.open(path) as doc:
                  images = sum(len(page.get_images()) for page in doc)
                  assert images >= 0, (name, images)
                  text = ''.join(page.get_text() for page in doc)
                  assert 'Selection Sort' in text and 'Stooge Sort' in text
                  print(name, len(doc), 'pages', images, 'image placements')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sorting-cards-${{ steps.edition.outputs.version }}-review-build
          path: |
            build/Sorting-Algorithms-with-Playing-Cards.pdf
            build/Sorting-Algorithms-with-Playing-Cards-Booklet-LONG-EDGE.pdf
            build/build-report.json
          if-no-files-found: error
